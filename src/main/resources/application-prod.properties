# Render and other container hosts provide PORT automatically.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bootstrap the initially empty hosted MySQL-compatible database from the JPA entities.
# Once the first deployment has created tables, switch to validate and manage changes with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
linkhub.upload-dir=${LINKHUB_UPLOAD_DIR:uploads}
linkhub.public-base-url=${LINKHUB_PUBLIC_BASE_URL}
linkhub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
linkhub.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://linkhub-*.vercel.app}

# Bound per-instance request concurrency for Render's small free container.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=32

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# This deployment has no SMTP credentials; mail status must not make the API unready.
management.health.mail.enabled=false
